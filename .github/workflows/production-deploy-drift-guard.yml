name: Production Deploy Drift Guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-drift-guard-main
  cancel-in-progress: true

jobs:
  verify-production-build-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production release-health and build marker catch up
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const markerUrls = [
            'https://sway.tips/api/build-marker',
            'https://www.sway.tips/api/build-marker',
            'https://app.sway.tips/api/build-marker'
          ];
          const healthUrls = [
            'https://sway.tips/api/release-health',
            'https://www.sway.tips/api/release-health',
            'https://app.sway.tips/api/release-health'
          ];

          const expectedSha = process.env.EXPECTED_SHA;
          const timeoutMs = 15 * 60 * 1000;
          const intervalMs = 30 * 1000;
          const requestTimeoutMs = 12 * 1000;
          const started = Date.now();

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function formatObservation(observation) {
            const lines = [];
            lines.push(`URL: ${observation.url}`);
            lines.push(`HTTP: ${observation.status}`);
            lines.push(`Content-Type: ${observation.contentType || 'missing'}`);
            if (observation.error) {
              lines.push(`Error: ${observation.error}`);
            }
            if (observation.bodySnippet) {
              lines.push(`Body snippet: ${observation.bodySnippet}`);
            }
            if (observation.commit) {
              lines.push(`Commit: ${observation.commit}`);
            }
            if (observation.releaseActive !== undefined) {
              lines.push(`releaseActive: ${observation.releaseActive}`);
            }
            return lines.join('\n');
          }

          async function fetchJson(url) {
            const observation = {
              url,
              status: 'n/a',
              contentType: '',
              commit: '',
              releaseActive: undefined,
              error: '',
              bodySnippet: ''
            };

            try {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), requestTimeoutMs);
              let response;
              try {
                response = await fetch(url, { redirect: 'follow', signal: controller.signal });
              } finally {
                clearTimeout(timer);
              }
              observation.status = response.status;
              observation.contentType = response.headers.get('content-type') || '';
              const body = await response.text();
              observation.bodySnippet = body.slice(0, 180).replace(/\s+/g, ' ').trim();

              let parsed;
              try {
                parsed = JSON.parse(body);
              } catch {
                parsed = null;
              }

              if (!parsed || typeof parsed !== 'object') {
                observation.error = 'Response is not JSON.';
                return { ok: false, observation };
              }

              if (parsed.service !== 'sway.tips') {
                observation.error = `Unexpected service marker: ${String(parsed.service)}`;
                return { ok: false, observation };
              }

              if (typeof parsed.commit !== 'string' || parsed.commit.length < 7) {
                observation.error = 'Commit marker is missing or invalid.';
                return { ok: false, observation };
              }

              observation.commit = parsed.commit;
              if (parsed.commit !== expectedSha) {
                observation.error = `Commit mismatch. Expected ${expectedSha}, got ${parsed.commit}`;
                return { ok: false, observation };
              }

              return { ok: true, observation, parsed };
            } catch (error) {
              observation.error = error instanceof Error ? error.message : String(error);
              return { ok: false, observation };
            }
          }

          async function checkOnce() {
            const observations = [];
            let allOk = true;

            for (const url of markerUrls) {
              const result = await fetchJson(url);
              observations.push(result.observation);
              if (!result.ok) allOk = false;
            }

            for (const url of healthUrls) {
              const result = await fetchJson(url);
              if (result.ok) {
                const parsed = result.parsed;
                result.observation.releaseActive = parsed.releaseActive;
                if (parsed.releaseActive !== true) {
                  result.observation.error = 'releaseActive is not true.';
                  allOk = false;
                } else if (!parsed.database?.reachable) {
                  result.observation.error = 'database.reachable is not true.';
                  allOk = false;
                } else if (!parsed.migrations?.compatible) {
                  result.observation.error = 'migrations.compatible is not true.';
                  allOk = false;
                } else if (result.observation.status !== 200) {
                  result.observation.error = `Expected HTTP 200 for active release-health, got ${result.observation.status}`;
                  allOk = false;
                }
              } else {
                allOk = false;
              }
              observations.push(result.observation);
            }

            return { allOk, observations };
          }

          let attempt = 0;
          while (Date.now() - started < timeoutMs) {
            attempt += 1;
            const { allOk, observations } = await checkOnce();

            console.log(`Attempt ${attempt}:`);
            for (const o of observations) {
              console.log(formatObservation(o));
              console.log('----');
            }

            if (allOk) {
              console.log('Production build marker and release-health match pushed commit on all domains.');
              process.exit(0);
            }

            await sleep(intervalMs);
          }

          console.error('Timed out waiting for production release-health/build-marker to match pushed commit.');
          process.exit(1);
          NODE
