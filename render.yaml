services:
  - type: web
    name: sway-tips-web
    runtime: node
    branch: main
    # main is the release channel: Render auto-deploys on commit when merge/deploy are authorized.
    # GitHub Actions / required check `validate` are NOT A GATE (unused; billing irrelevant).
    # Do NOT use checksPass while Production Deploy Drift Guard observes catch-up (deadlock).
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    # Fail closed: process up + DB reachable + migrations compatible with this commit.
    healthCheckPath: /api/release-health
    domains:
      - sway.tips
      - www.sway.tips
      - app.sway.tips
    envVars:
      - key: NODE_ENV
        value: production
      # Migration 0028 is live and durable writers are canonical. Set this
      # exact emergency kill switch true only to pause live-room mutations.
      - key: SWAY_LIVE_ROOM_DURABILITY_WRITES_DISABLED
        value: "false"
      # Explicit test-money pilot switch. Code ignores this switch with live
      # Stripe keys; live money requires the independent PayPal payout gate.
      - key: SWAY_TEST_MODE_PLATFORM_BALANCE_ENABLED
        value: "false"
      - key: SWAY_TEST_MODE_PLATFORM_BALANCE_PERFORMER_IDS
        value: ""
      # The customer checkout gross-up preserves the performer's stated amount
      # and Sway's platform fee. Live Stripe collection stays locked until the
      # exact account pricing is reviewed and the versioned confirmation flips.
      - key: SWAY_STRIPE_PROCESSING_FEE_BPS
        value: "290"
      - key: SWAY_STRIPE_PROCESSING_FIXED_CENTS
        value: "30"
      - key: SWAY_STRIPE_PROCESSING_FEE_CONFIRMED
        value: "false"
      - key: SWAY_STRIPE_PROCESSING_FEE_APPROVAL_VERSION
        value: ""
      # PayPal/Venmo performer payouts remain fail-closed until PayPal approves
      # Sway, live credentials/webhook are installed, and the versioned release
      # flags below are deliberately enabled. Stripe remains incoming-only.
      - key: SWAY_PAYOUT_RECIPIENT_ENCRYPTION_KEY_BASE64
        sync: false
      - key: SWAY_PAYPAL_PAYOUTS_MODE
        sync: false
      - key: SWAY_PAYPAL_PAYOUTS_CLIENT_ID
        sync: false
      - key: SWAY_PAYPAL_PAYOUTS_CLIENT_SECRET
        sync: false
      - key: SWAY_PAYPAL_PAYOUTS_WEBHOOK_ID
        sync: false
      - key: SWAY_PAYPAL_PAYOUTS_FEE_CENTS
        value: "25"
      - key: SWAY_PAYPAL_PAYOUTS_CONFIRMED
        value: "false"
      - key: SWAY_PAYPAL_VENMO_PAYOUTS_CONFIRMED
        value: "false"
      - key: SWAY_PAYPAL_PAYOUTS_TEST_EXECUTION_ENABLED
        value: "false"
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_EXECUTION_ENABLED
        value: "false"
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_APPROVAL_VERSION
        value: ""
      - key: SWAY_PAYPAL_VENMO_PAYOUTS_LIVE_APPROVAL_VERSION
        value: ""
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_FUNDING_CONFIRMED
        value: "false"
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_FUNDING_VERSION
        value: ""
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_FEE_CONFIRMED
        value: "false"
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_FEE_VERSION
        value: ""
      - key: SWAY_PERFORMER_KYC_PROCESS_APPROVAL_VERSION
        value: ""
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_CANARY_PERFORMER_ID
        value: ""
      - key: SWAY_PAYPAL_PAYOUTS_LIVE_CANARY_VERSION
        value: ""
      # Native ticket money remains explicitly closed in production until the
      # versioned approval, legal, finance, support, and live-proof gates pass.
      - key: SWAY_NATIVE_TICKETS_ENABLED
        value: "false"
      - key: SWAY_TICKET_TAX_MODE
        value: stripe_automatic
      # Select the Stripe event-admission tax code approved for Sway's ticket
      # product in Render. Stripe Automatic Tax remains fail-closed without it.
      - key: SWAY_TICKET_STRIPE_TAX_CODE
        sync: false
      - key: SWAY_TICKET_QR_SECRET
        generateValue: true
      - key: SWAY_TICKET_PRODUCTION_APPROVAL_VERSION
        value: 2026-07-28.native-ga.v3
      - key: SWAY_AUDIO_STORAGE_PROVIDER
        value: r2
      - key: SWAY_AUDIO_R2_BUCKET
        value: sway-audio-originals
      # Working uploads and unreleased files are bounded without limiting the
      # number of releases or deleting immutable release-package originals.
      - key: SWAY_AUDIO_WORKSPACE_LIMIT_BYTES
        value: "5368709120"
      - key: SWAY_AUDIO_WORKING_OBJECT_LIMIT
        value: "10000"
      - key: SWAY_AUDIO_R2_ACCOUNT_ID
        sync: false
      - key: SWAY_AUDIO_R2_ACCESS_KEY_ID
        sync: false
      - key: SWAY_AUDIO_R2_SECRET_ACCESS_KEY
        sync: false
