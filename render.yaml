services:
  - type: web
    name: sway-tips-web
    runtime: node
    branch: main
    # main is the release channel: Render auto-deploys on commit after a verified merge.
    # Merge gate is GitHub required check `validate` (must execute real steps).
    # Do NOT use checksPass while Production Deploy Drift Guard observes catch-up (deadlock).
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    # Fail closed: process up + DB reachable + migrations compatible with this commit.
    healthCheckPath: /api/release-health
    domains:
      - sway.tips
      - www.sway.tips
      - app.sway.tips
    envVars:
      - key: NODE_ENV
        value: production
      # Migration 0028 is live and durable writers are canonical. Set this
      # exact emergency kill switch true only to pause live-room mutations.
      - key: SWAY_LIVE_ROOM_DURABILITY_WRITES_DISABLED
        value: "false"
      # Native ticket money remains explicitly closed in production until the
      # versioned approval, legal, finance, support, and live-proof gates pass.
      - key: SWAY_NATIVE_TICKETS_ENABLED
        value: "false"
      - key: SWAY_TICKET_TAX_MODE
        value: stripe_automatic
      # Select the Stripe event-admission tax code approved for Sway's ticket
      # product in Render. Stripe Automatic Tax remains fail-closed without it.
      - key: SWAY_TICKET_STRIPE_TAX_CODE
        sync: false
      - key: SWAY_TICKET_QR_SECRET
        generateValue: true
      - key: SWAY_TICKET_PRODUCTION_APPROVAL_VERSION
        value: 2026-07-28.native-ga.v3
      - key: SWAY_AUDIO_STORAGE_PROVIDER
        value: r2
      - key: SWAY_AUDIO_R2_BUCKET
        value: sway-audio-originals
      - key: SWAY_AUDIO_R2_ACCOUNT_ID
        sync: false
      - key: SWAY_AUDIO_R2_ACCESS_KEY_ID
        sync: false
      - key: SWAY_AUDIO_R2_SECRET_ACCESS_KEY
        sync: false
